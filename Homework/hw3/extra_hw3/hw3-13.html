<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>

    console.log(`Створити цикл for на 10 ітерацій з кроком 1. Вивести поточний номер кроку через console.log та document.write`)
    for (let i = 1; i <= 10; i++) {
        console.log(i);
        document.write(i + '<br>');
    }

    console.log(`Створити цикл for на 100 ітерацій з кроком 1. Вивести поточний номер кроку через console.log та document.write`)
    document.write('Створити цикл for на 100 ітерацій з кроком 1. Вивести поточний номер кроку через console.log та document.write' + '<br>');
    for (let i = 1; i <= 100; i++) {
        console.log(i);
        document.write(i + '<br>');
    }

    console.log(`Створити цикл for на 100 ітерацій з кроком 2. Вивести поточний номер кроку через console.log та document.write`)
    document.write('Створити цикл for на 100 ітерацій з кроком 2. Вивести поточний номер кроку через console.log та document.write' + '<br>');
    for (let i = 1; i <= 100; i += 2) {
        console.log(i);
        document.write(i + '<br>');
    }

    console.log(`Створити цикл for на 100 ітерацій. Вивести тільки парні кроки. через console.log + document.write`)
    document.write('Створити цикл for на 100 ітерацій. Вивести тільки парні кроки. через console.log + document.write' + '<br>');
    for (let i = 1; i <= 100; i++) {
        if (i % 2 === 0) {
            console.log(i);
            document.write(i + '<br>');
        }
    }

    console.log(`Створити цикл for на 100 ітерацій. Вивести тільки непарні кроки. через console.log + document.write`)
    document.write('Створити цикл for на 100 ітерацій. Вивести тільки непарні кроки. через console.log + document.write' + '<br>');
    for (let i = 1; i <= 100; i++) {
        if (i % 2 !== 0) {
            console.log(i);
            document.write(i + '<br>');
        }
    }

</script>
</body>
</html>
