<body>
<script>

    let set = new Set();
    set.add('one');
    set.add('two');
    set.add('one');
    set.add('xxx');
    console.log(set);
    console.log(set.has('xxx'));

    set.delete('xxx');
    console.log(set);

    console.log(set.size);

    // итерация при помощи set
    set.forEach(value => console.log(value))


    let arrayFromSet = Array.from(set);
    console.log(arrayFromSet);


    // set помогает убрать неуникальные значения из массива и сделать из этого новый массив
    let set2 = new Set([11, 22, 33, 44, 11, 22, 55]);
    console.log(set2);
    let numbers = Array.from(set2);
    console.log(numbers);

</script>
