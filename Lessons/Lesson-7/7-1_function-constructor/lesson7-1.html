<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>

    function User(name, age, status) {
        this.name = name;
        this.age = age;
        this.status = status;
    }

    let user1 = new User('Anna', 60, true);
    let user2 = new User('Alex', 50, true);
    console.log(user1, user2);

    function User2(name, age, status, wife) {
        this.name = name;
        this.age = age;
        this.status = status;
        this.wife = wife;
    }

    let user3 = new User2('Alex', 50, true, {name: 'Anna', age: 43, status: true});
    console.log(user3);
    console.log(user3.wife);

    function User3(name, age, status, wifeName, wifeAge) {
        this.name = name;
        this.age = age;
        this.status = status;
        this.wife = {name: wifeName, age: wifeAge};
        this.greeting = function () {
            console.log('Hello!');
        }
    }

    let user4 = new User3('Alex', 50, true, 'Anna', 43);
    console.log(user4);
    console.log(user4.wife);
    user4.greeting(); // выведет Hello!

</script>
</body>
</html>
