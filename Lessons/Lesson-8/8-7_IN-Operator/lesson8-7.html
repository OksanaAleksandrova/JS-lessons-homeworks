<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>

    const obj = {
        name: 'bob'
    }

    if (obj.age) {
        console.log('here');
    } else {
        console.log('else'); // выведет эту строку, потому что age нет
    }

    console.log(obj.name);
    console.log(obj.age); // undefined

    console.log('name' in obj); //true
    const result = 'age' in obj; //false
    console.log(result);

    const newVar = Object.create(obj);
    console.log(newVar);
    console.log(newVar.name);
    console.log('name' in newVar); //true
    if (newVar.name) {
        console.log('!!!');
    }

    const obj2 = {
        a: false,
        b: 0,
        c: '',
        d: null,
        e: undefined,
    }

    if (obj2.a) {
        console.log('a'); // ничего не выведет, потому что a: false
    }
    if (obj2.b) {
        console.log('b'); // ничего не выведет, потому что b: 0
    }
    console.log('----------');
    console.log('a' in obj2); // выведет true, потому что такое поле есть
    console.log('b' in obj2); // выведет true, потому что такое поле есть


</script>
</body>
</html>
