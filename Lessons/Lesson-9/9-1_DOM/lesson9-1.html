<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>

<h1>DOM title</h1>

<ul class="menu" id="list-1">
    <li>item 1 1</li>
    <li>item 1 2</li>
    <li>item 1 3</li>
    <li>item 1 4</li>
    <li>item 1 5</li>
</ul>

<ul class="menu" id="list-2">
    <li>item 2 1</li>
    <li>item 2 2</li>
    <li>item 2 3</li>
    <li>item 2 4</li>
    <li>item 2 5</li>
</ul>

<script>

    //DOM
    // console.log(document);
    // console.log(document.head);
    // console.log(document.head.innerHTML);
    // console.log(document.head.children);
    // console.log(document.body);
    // console.log(document.body.innerHTML);

    // поиск по id
    let ul1 = document.getElementById('list-1');
    console.log(ul1);

    // поиск по class
    let menuCollection = document.getElementsByClassName('menu');
    console.log(menuCollection);

    for (const menuCollectionElement of menuCollection) {
        console.log(menuCollectionElement);
    }


    // поиск по tag
    let ulList = document.getElementsByTagName('ul');
    console.log(ulList);
    let liList = document.getElementsByTagName('li');
    console.log(liList);

    let list1 = document.getElementById('list-1');
    console.log(list1);
    let list1LiCollection = list1.getElementsByTagName('li')
    console.log(list1LiCollection);

    // querySelector
    // console.log(document.querySelector('ul'));
    // console.log(document.querySelectorAll('ul'));

    console.log(document.querySelector('body .menu'));
    console.log(document.querySelectorAll('body .menu'));
    console.log(document.querySelectorAll('.menu:nth-child(2)>li')); // выведет li из второго списка ul
    console.log(document.querySelectorAll('#list-2>li')); // выведет li из второго списка ul

    let nodeListOf=document.querySelectorAll('#list-2>li');
    console.log(nodeListOf);

    for(const node of nodeListOf) {
        console.log(node);
    }

</script>
</body>
</html>
