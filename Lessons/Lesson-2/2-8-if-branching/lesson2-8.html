    // вариант 2 - &&confirm. В этом случае нет варианта else. Можно значение &&confirm присвоить переменной
    let color = prompt('enter color');
    let isRoadClear = confirm('is the road clear?');
    if (color === 'green' && isRoadClear) {
        console.log('go');
    } else if (color === 'orange') {
        console.log('wait');
    } else if (color === 'red') {
        console.log('stop');
