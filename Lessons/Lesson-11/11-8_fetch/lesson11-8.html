    fetch('https://dummyjson.com/products?limit=3&skip=10') // ?limit=3 - выведет три продукта, &skip=10 - пропустятся первые 10 продуктов
        .then(value => value.json())
        // .then(products => console.log(products))
        .then(result => {
            console.log(result);
            let {products} = result;

            document.write(`<div>`);
            for (const product of products) {
                document.write(`<div>`);
                document.write(`<p>${product.id} ___ ${product.title} - ${product.price}</p>`);
                document.write(`<img src="${product.thumbnail}" alt="">`);
                document.write(`</div>`);
            }
            document.write(`</div>`);
        });


    fetch('https://dummyjson.com/products/add', {

        body: JSON.stringify({
