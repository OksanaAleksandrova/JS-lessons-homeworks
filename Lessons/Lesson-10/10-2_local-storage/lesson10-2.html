<!doctype html>
<html lang="en">
<head>

<body>
<script>

    localStorage.setItem('user', JSON.stringify({id: 1, name: 'sam'})); // данные запишутся в localStorage. Открыть вкладку application - localStorage в браузере
    let userJSON = localStorage.getItem('user'); // достаётся запись user в формате JSON (стринга)
    console.log(userJSON);
    let user = JSON.parse(userJSON); // преобразовать этот JSON-объект в обычный объект
    console.log(user);
    // Далее добавляем изменения и делаем обратные действия. Т.е. после сохраняем в формате JSON
    user.age = 34;
    console.log(user);
    // записываем нового stringify user в ячейку
    localStorage.setItem('user', JSON.stringify(user));
