<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>

    let str = 'hello okten';
    console.log(str);

    let s = str.concat('!!!')
    console.log(s);

    console.log(str.toUpperCase());
    console.log(str.toLocaleLowerCase());
    console.log(str.startsWith('he')); // возвращает true или false
    console.log(str.endsWith('en'));
    console.log(str.substring(0, 7)); // выводит до индекса 7
    console.log(str.indexOf('o'));
    console.log(str.lastIndexOf('o'));
    console.log(str.indexOf('o', 5)); // индекс со значением 'o' после индекса 5
    console.log(str.charAt(8));
    // console.log(str.replace('e', '!'));
    console.log(str.replaceAll('e', '!'));
    let split = str.split(' ');
    console.log(split);


</script>
