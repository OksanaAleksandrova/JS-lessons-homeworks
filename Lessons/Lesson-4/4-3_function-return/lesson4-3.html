<script>

    function calc(a, b) {
        // let result = a + b;
        // return result;
        return a + b;
    }

    let r1 = calc(10, 20);
    let r2 = calc(20, 22);
    console.log(r1, r2);


    function tax(sum) {
        let pdv = sum / 100 * 20;
        let warTax = sum / 100 * 1.5;
        return sum - pdv - warTax;
    }

    let number = tax(10000);
    console.log(number);

    //     сокращаем количество строк
    function percentage(value, per) {
        return value / 100 * per;
    }

    function tax1(sum) {
        // let pdv = percentage(sum, 20)
        // let warTax = percentage(sum, 1.5)
        // return sum - pdv - warTax;
        return sum - percentage(sum, 20) - percentage(sum, 1.5);
    }

    let number1 = tax1(10000);
    console.log(number1);


    function userFilter(users) {
        let filteredUsers = [];
        for (const user of users) {
            if (user.age > 30) {
                filteredUsers.push(user);
            }
        }
        return filteredUsers;
    }
    let users = [
      { id: 1, name: 'Alex', age: 20, status: true },
      { id: 2, name: 'John', age: 25, status: false },
      { id: 3, name: 'Maria', age: 22, status: true },
      { id: 4, name: 'Bob', age: 31, status: false },
      { id: 5, name: 'Anna', age: 28, status: true },
      { id: 6, name: 'Jack', age: 35, status: true },
      { id: 7, name: 'Sally', age: 19, status: false },
      { id: 8, name: 'David', age: 27, status: true },
      { id: 9, name: 'Kate', age: 24, status: false },
      { id: 10, name: 'Mike', age: 33, status: true },
      { id: 11, name: 'Emma', age: 29, status: true },
      { id: 12, name: 'Leo', age: 21, status: false }
    ];

    let filter = userFilter(users);
    console.log(filter);


</script>
